name: Bootstrap Vessel Windows Build

on:
  push:
    branches:
      - feat/vessel-live2d-model
  workflow_dispatch:

jobs:
  apply-and-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Apply approved Vessel commits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am 0001-feat-add-vessel-sprite-pet-model.patch
          git am 0002-feat-add-vessel-blink-and-windows-build.patch
          git rm 0001-feat-add-vessel-sprite-pet-model.patch
          git rm 0002-feat-add-vessel-blink-and-windows-build.patch
          git rm .github/workflows/bootstrap-vessel-windows.yml
          git rm .github/workflows/build-vessel-windows.yml
          git commit -m "chore: remove bootstrap files"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install pillow==12.3.0 numpy==2.3.5

      - name: Validate project
        run: |
          python custom-models/vessel-live2d/scripts/validate_sprite_model.py
          pnpm exec tsc --noEmit

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vessel-bongocat-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
